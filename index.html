<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daybook</title>
<meta name="description" content="Money, reading, fitness and the day, in one place.">
<meta name="theme-color" content="#f6f6f7">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daybook">
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sorry-Sugar palette: white, charcoal, hot pink. */
:root{
  --bg:#f6f6f7;--card:#fff;--card2:#f6f6f7;--ink:#2b2b2e;--mute:#7b7b82;--line:#ececef;
  --acc:#e8318c;--acc2:#ff5aa8;--accbg:#fde7f1;--accink:#fff;
  --char:#2b2b2e;--charink:#fff;
  --good:#16a34a;--goodbg:#dcfce7;
  --warn:#c26a00;--warnbg:#fff1d6;--bad:#d92d3a;--badbg:#fde4e6;--info:#6d4aff;--infobg:#eee9ff;
  --chip:#f0f0f2;--shadow:0 1px 2px rgba(43,43,46,.04),0 8px 24px rgba(43,43,46,.06);
  --ease:cubic-bezier(.22,1,.36,1);
  --disp:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#111113;--card:#1b1b1e;--card2:#232327;--ink:#f3f3f4;--mute:#9a9aa2;--line:#2a2a2f;
    --acc:#ff4fa3;--acc2:#ff7dbb;--accbg:#3a1529;--accink:#fff;--char:#000;--charink:#fff;
    --good:#4ade80;--goodbg:#13301f;--warn:#fbbf24;--warnbg:#33270b;--bad:#f87171;--badbg:#3a1616;--info:#a78bfa;--infobg:#241a40;
    --chip:#26262b;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111113;--card:#1b1b1e;--card2:#232327;--ink:#f3f3f4;--mute:#9a9aa2;--line:#2a2a2f;
  --acc:#ff4fa3;--acc2:#ff7dbb;--accbg:#3a1529;--accink:#fff;--char:#000;--charink:#fff;
  --good:#4ade80;--goodbg:#13301f;--warn:#fbbf24;--warnbg:#33270b;--bad:#f87171;--badbg:#3a1616;--info:#a78bfa;--infobg:#241a40;
  --chip:#26262b;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{transition:transform .15s var(--ease),background-color .2s,color .2s,box-shadow .2s}
button:active{transform:scale(.97)}
a{color:var(--acc)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(env(safe-area-inset-bottom) + 110px)}

/* top bar */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;margin:0 -16px 14px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:var(--bg);transition:box-shadow .25s,background-color .25s}
.top.scrolled{box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.05)}
.top h1{font-family:var(--disp);font-weight:800;font-size:30px;margin:0;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.top h1 i{font-style:normal;color:var(--acc)}
.top .sub{color:var(--mute);font-size:12.5px;margin-top:3px}
.icon-btn{border:0;background:var(--card);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;flex:none;color:var(--ink)}
.icon-btn svg{width:21px;height:21px}

/* cards */
.card{background:var(--card);border-radius:22px;padding:16px;margin:0 0 12px;box-shadow:var(--shadow)}
.card.flat{background:var(--card2);box-shadow:none}
.card.hero{background:var(--char);color:var(--charink);box-shadow:0 14px 34px rgba(43,43,46,.22)}
.card.hero .muted,.card.hero .small.muted{color:rgba(255,255,255,.62)}
.card.hero hr{border-top-color:rgba(255,255,255,.12)}
.card.pink{background:linear-gradient(135deg,var(--acc) 0%,var(--acc2) 100%);color:#fff;box-shadow:0 14px 34px rgba(232,49,140,.32)}
.card.pink .muted{color:rgba(255,255,255,.8)}
.card.pink .bar{background:rgba(255,255,255,.28)}
.card.pink .bar>i{background:#fff}
.card.pink .btn.ghost{background:rgba(255,255,255,.22);color:#fff}
.h2{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15.5px;margin:0 0 10px}
.h2 .link{font-weight:600;font-size:13px;color:var(--acc);background:none;border:0;cursor:pointer;padding:4px}
.sec{font-family:var(--disp);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px;font-weight:700}
.muted{color:var(--mute)}.small{font-size:13px}.tiny{font-size:12px}
.big{font-family:var(--disp);font-size:44px;font-weight:800;letter-spacing:.005em;line-height:1}
.mid{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.05}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.card.hero .bad,.card.pink .bad{color:#ffd0d6}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--mute);font-weight:500}.stat .v{font-family:var(--disp);font-size:26px;font-weight:800;margin-top:2px;line-height:1.1}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.item:first-child{border-top:0}
.item:active{transform:none;background:var(--card2)}
.item .em,.em{width:40px;height:40px;border-radius:13px;background:var(--accbg);display:grid;place-items:center;font-size:19px;flex:none}
.item .amt{font-weight:700;white-space:nowrap}
.item .t,.t{font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--mute);vertical-align:middle}
.badge.good{background:var(--goodbg);color:var(--good)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.info{background:var(--infobg);color:var(--info)}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;margin:0 0 8px;font-size:14px}
.alert.warn{background:var(--warnbg);color:var(--warn)}.alert.bad{background:var(--badbg);color:var(--bad)}.alert.info{background:var(--infobg);color:var(--info)}.alert.good{background:var(--goodbg);color:var(--good)}
.alert b{font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin:0 0 14px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--mute);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--char);color:var(--charink);box-shadow:0 4px 12px rgba(43,43,46,.18)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.5px solid transparent;background:var(--chip);border-radius:99px;padding:7px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;font-weight:500}
.chip.on{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:700}
.btn{border:0;background:var(--acc);color:var(--accink);font-weight:700;border-radius:16px;padding:14px 16px;cursor:pointer;font-size:15px;box-shadow:0 8px 20px rgba(232,49,140,.25)}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:none}
.btn.bad{background:var(--badbg);color:var(--bad);box-shadow:none}
.btn.sm{padding:9px 13px;font-size:13.5px;border-radius:12px;box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{border:0;background:var(--card);border-radius:18px;padding:13px 4px 11px;box-shadow:var(--shadow);cursor:pointer;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick button span{font-size:21px;width:42px;height:42px;border-radius:14px;background:var(--accbg);display:grid;place-items:center}
.fld{display:block;margin:0 0 12px}
.fld>span{display:block;font-size:12.5px;color:var(--mute);margin:0 0 5px;font-weight:600}
.lbl{font-size:12.5px;color:var(--mute);margin:0 0 6px;font-weight:600}
input:not([type=checkbox]):not([type=file]),select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card2);border-radius:14px;padding:11px 13px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px var(--accbg)}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.amtin{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);margin:4px 0 16px;padding-bottom:4px;transition:border-color .2s}
.amtin:focus-within{border-color:var(--acc)}
.amtin span{font-family:var(--disp);font-size:34px;color:var(--acc);font-weight:800}
.amtin input{border:0!important;background:none!important;box-shadow:none!important;font-family:var(--disp);font-size:44px!important;font-weight:800;padding:2px 0!important}
.check{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.hint{font-size:12.5px;color:var(--mute);margin:-4px 0 12px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* side drawer */
.drawer{position:fixed;inset:0;z-index:30;pointer-events:none}
.drawer .dscrim{position:absolute;inset:0;background:rgba(20,20,22,.5);opacity:0;transition:opacity .3s var(--ease)}
.drawer .dpanel{position:absolute;top:0;bottom:0;left:0;width:min(84vw,310px);background:var(--card);transform:translateX(-102%);transition:transform .38s var(--ease);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 14px);box-shadow:20px 0 40px rgba(0,0,0,.12);overflow-y:auto}
.drawer.open{pointer-events:auto}
.drawer.open .dscrim{opacity:1}
.drawer.open .dpanel{transform:none}
.drawer.open .nav-i{animation:navin .45s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 80ms)}
@keyframes navin{from{opacity:0;transform:translateX(-14px)}}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.brand b{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b i{font-style:normal;color:var(--acc)}
.brand small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.mark{width:46px;height:46px;border-radius:14px;background:#000;display:block;flex:none;object-fit:cover}
.mark.lg{width:84px;height:84px;border-radius:24px;margin:0 auto 18px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.nav-i{display:flex;align-items:center;gap:13px;width:100%;border:0;background:none;padding:12px 12px;border-radius:16px;cursor:pointer;text-align:left;margin:2px 0;color:var(--ink)}
.nav-i .ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none;transition:background-color .2s,color .2s}
.nav-i .ic svg{width:20px;height:20px}
.nav-i .nt{font-weight:700;font-size:15.5px}
.nav-i .nm{font-size:12px;color:var(--mute)}
.nav-i.on{background:var(--accbg)}
.nav-i.on .ic{background:var(--acc);color:#fff}
.nav-i.on .nt{color:var(--acc)}
.dfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}

.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 22px);width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:32px;line-height:1;box-shadow:0 12px 28px rgba(232,49,140,.42);z-index:21;cursor:pointer;display:grid;place-items:center;animation:fabin .5s var(--ease) both}
@keyframes fabin{from{transform:scale(.4) rotate(-90deg);opacity:0}}
.sheet{position:fixed;inset:0;z-index:40;visibility:hidden}
.sheet.open{visibility:visible}
.scrim{position:absolute;inset:0;background:rgba(20,20,22,.5);opacity:0;transition:opacity .3s var(--ease)}
.sheet.open .scrim{opacity:1}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;max-height:92vh;overflow-y:auto;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(105%);transition:transform .42s var(--ease)}
.sheet.open .panel{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.shead h3{margin:0;font-family:var(--disp);font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.x{border:0;background:var(--chip);border-radius:12px;width:36px;height:36px;cursor:pointer;font-size:19px;flex:none;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(16px) scale(.96);background:var(--char);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.32s var(--ease);z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.warn{background:var(--warn);color:#fff}.toast.bad{background:var(--bad);color:#fff}
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.month button{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;box-shadow:var(--shadow);cursor:pointer;font-size:18px;color:var(--ink)}
.month b{font-family:var(--disp);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--disp);font-weight:800;font-size:30px;line-height:1}
.ring .c small{display:block;font-family:'DM Sans',sans-serif;font-size:10.5px;opacity:.65;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}
.tasks .task{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit}
.card.hero .tasks .task{border-top-color:rgba(255,255,255,.1)}
.tasks .task:first-child{border-top:0}
.tick-box{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:14px;color:#fff;transition:background-color .2s,border-color .2s}
.card.hero .tick-box{border-color:rgba(255,255,255,.25)}
.task.done .tick-box{background:var(--acc);border-color:var(--acc)}
.task.done .tl{opacity:.55;text-decoration:line-through}
.task.pop .tick-box{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:11px;color:var(--mute);font-weight:600}
.week .dot{margin:5px auto 0;width:36px;height:36px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:700}
.week .dot.on{background:var(--acc);color:#fff}
.week .dot.part{background:var(--accbg);color:var(--acc)}
.week .dot.today{outline:2px solid var(--acc);outline-offset:2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:34px;background:linear-gradient(180deg,var(--acc2),var(--acc));border-radius:9px 9px 4px 4px;min-height:3px}
.bars .b.dim i{background:var(--chip)}
.bars .b span{font-size:10.5px;color:var(--mute);font-weight:600}
.bars .b em{font-size:10px;color:var(--mute);font-style:normal}
.donut{display:flex;gap:16px;align-items:center}
.donut svg{width:134px;height:134px;flex:none;transform:rotate(-90deg)}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.pickup{border-left:3px solid var(--acc);padding:2px 0 2px 12px;margin:10px 0}
.pickup .k{font-size:11px;color:var(--acc);font-weight:800;letter-spacing:.08em}
.concept{padding:10px 0;border-top:1px solid var(--line)}
.concept:first-child{border-top:0}
.links a{display:block;word-break:break-all;font-size:13.5px;margin:3px 0}
.timer{display:flex;align-items:center;gap:12px;background:var(--char);color:#fff;border-radius:20px;padding:13px 15px;margin:0 0 12px;box-shadow:0 12px 28px rgba(43,43,46,.22)}
.timer .tick{font-family:var(--disp);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer .x{background:rgba(255,255,255,.14);color:#fff}
.timer .live{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font-size:14px}
.empty .e{font-size:36px;margin-bottom:8px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.auth{max-width:380px;margin:12vh auto 0;padding:0 16px;animation:rise .6s var(--ease) both}
.auth h1{font-family:var(--disp);font-weight:800;font-size:40px;text-transform:uppercase;letter-spacing:.01em}
.auth h1 i{font-style:normal;color:var(--acc)}
.load{display:grid;place-items:center;height:70vh;color:var(--mute)}
.moods{display:flex;gap:6px;margin:0 0 12px}
.moods button{flex:1;min-width:0;border:1.5px solid transparent;background:var(--chip);border-radius:14px;padding:8px 0;font-size:22px;cursor:pointer}
.moods button.on{border-color:var(--acc);background:var(--accbg);transform:scale(1.06)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{border:0;background:var(--card);height:34px;min-width:34px;border-radius:11px;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);font-weight:600}
.pre{white-space:pre-wrap;word-break:break-word}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* intake */
.intk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.itile{position:relative;border:0;background:var(--card);border-radius:18px;padding:12px 8px 10px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.itile .ie{font-size:22px}
.itile .iv{font-family:var(--disp);font-size:24px;font-weight:800;line-height:1.1}
.itile .iv small{font-size:15px;color:var(--mute)}
.itile .iplus{position:absolute;top:8px;right:9px;width:20px;height:20px;border-radius:7px;background:var(--acc);color:#fff;font-weight:800;font-size:15px;line-height:20px}
.itile.ok{background:var(--accbg)}.itile.ok .iv{color:var(--acc)}
.itile.over{background:var(--badbg)}.itile.over .iv{color:var(--bad)}
.bump{animation:bump .4s var(--ease)}
@keyframes bump{40%{transform:scale(1.08)}}
.glass{position:relative;width:78px;height:112px;border:3px solid #3b82f6;border-top-width:0;border-radius:4px 4px 20px 20px;overflow:hidden;flex:none;background:var(--card2)}
.glass .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#60a5fa,#2563eb);transition:height .8s var(--ease)}
.glass .fill::before{content:'';position:absolute;left:50%;width:220px;height:220px;margin-left:-110px;top:-212px;border-radius:43%;background:var(--card2);animation:spin 7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.glass .gl{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:18px;color:var(--ink);mix-blend-mode:normal;text-shadow:0 1px 2px rgba(255,255,255,.6)}
.stepper{display:grid;grid-template-columns:64px 1fr;gap:8px;margin-top:14px}
.stepper .btn{font-size:16px}
.week .dot.miss{background:var(--badbg);color:var(--bad)}

/* streaks */
.flame{font-size:40px;line-height:1;filter:grayscale(1) opacity(.5)}
.flame.lit{filter:none;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.08) rotate(-3deg)}}
.medals{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:16px;padding-bottom:2px}
.medals::-webkit-scrollbar{display:none}
.medal{flex:none;width:46px;text-align:center;font-size:10.5px;color:rgba(255,255,255,.45);font-weight:600}
.medal .m{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;margin:0 auto 4px;font-family:var(--disp);font-weight:800;font-size:17px;background:rgba(255,255,255,.08);border:1.5px dashed rgba(255,255,255,.18)}
.medal.on{color:#fff}
.medal.on .m{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;box-shadow:0 0 0 3px rgba(232,49,140,.3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--mute);text-align:center;font-weight:700;padding-bottom:2px}
.cd{aspect-ratio:1;border:0;border-radius:11px;background:var(--chip);font-size:12.5px;font-weight:700;color:var(--mute);cursor:pointer;display:grid;place-items:center;position:relative;padding:0}
.cd.done{background:var(--acc);color:#fff}
.cd.done.joined::before{content:'';position:absolute;right:100%;top:30%;bottom:30%;width:6px;background:var(--acc)}
.cd.part{background:var(--accbg);color:var(--acc)}
.cd.frozen{background:#dbeefe;color:#2563eb;font-size:15px}
.cd.frozen.joined::before{content:'';position:absolute;right:100%;top:30%;bottom:30%;width:6px;background:#dbeefe}
.cd.done.joined::before{background:var(--acc)}
.cd.miss{background:var(--chip);color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px}
.cd.none{background:transparent;color:var(--mute);opacity:.5}
.cd.future{background:transparent;color:var(--mute);opacity:.35;cursor:default}
.cd.today{outline:2px solid var(--ink);outline-offset:1px}
.cd.blank{visibility:hidden}
.legend2{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mute)}
.legend2 span{display:flex;align-items:center;gap:6px}
.legend2 .cd{width:14px;height:14px;border-radius:5px;aspect-ratio:auto;display:inline-block}
/* quotes, year goals, review */
.quote{display:block;width:100%;text-align:left;border:0;cursor:pointer;background:var(--card);border-radius:22px;padding:18px 18px 14px;margin:0 0 12px;box-shadow:var(--shadow);position:relative;color:var(--ink);border-left:4px solid var(--acc)}
.quote .qt{font-size:16.5px;line-height:1.5;font-weight:500;font-style:italic}
.quote .qm{font-size:12.5px;color:var(--mute);margin-top:8px;font-weight:600}
.quote.sm{padding:14px 16px 12px}.quote.sm .qt{font-size:15px}
.ygc{display:block;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink)}
.ygbar{position:relative;height:10px;border-radius:99px;background:var(--chip);margin-top:12px}
.ygbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ygbar b{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--ink)}
.enter .ygbar i{animation:growx 1s var(--ease) both;animation-delay:.25s}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.facts span{background:var(--chip);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:600}
/* day planner */
.ptask{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ptask .tick-box{background:none;cursor:pointer;padding:0}
.ptask.done .tick-box{background:var(--acc);border-color:var(--acc)}
.ptask.done .tl{opacity:.5;text-decoration:line-through}
.star{border:0;background:none;font-size:18px;color:var(--line);cursor:pointer;padding:2px 4px}
.star.on{color:#f5b301}
.tdel{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
/* lock screen */
#lockscreen{position:fixed;inset:0;z-index:100;background:var(--bg);display:none}
#lockscreen.on{display:block}
.lock{max-width:340px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 9vh) 24px 24px}
.pin{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}
.pin i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background .15s}
.pin i.on{background:var(--ink)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.keys button{height:66px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-family:var(--disp);font-size:28px;font-weight:800;color:var(--ink);cursor:pointer;width:66px;margin:0 auto}
.keys span{display:block}
/* work day */
.tdist{display:flex;height:12px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.12);margin-top:14px}
.card:not(.hero) .tdist{background:var(--chip)}
.tdist i{display:block;height:100%;transition:width .6s var(--ease)}
.card.hero .legend2{color:rgba(255,255,255,.7)}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.card.hero .wbtns .btn.ghost{background:rgba(255,255,255,.12);color:#fff}
.card.hero #wd-note{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}
.wlog{margin-top:12px;font-size:12.5px;line-height:1.7;opacity:.85}
.wtick{font-variant-numeric:tabular-nums}
/* mood */
.moodchart{display:flex;gap:6px;align-items:stretch}
.moodchart .ylab{display:flex;flex-direction:column;justify-content:space-between;font-size:14px;line-height:1;padding:2px 0 6px}
.moodchart svg{flex:1;min-width:0;width:100%;height:150px;overflow:hidden}
.moodchart .grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.enter .mline{stroke-dasharray:1000;animation:draw 1.6s var(--ease) both;animation-delay:.2s}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.lift{padding:9px 0;border-top:1px solid var(--line)}
.lift:first-of-type{border-top:0}
.lbar{position:relative;height:8px;border-radius:99px;background:var(--chip);margin-top:6px}
.lbar::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.lbar i{position:absolute;top:0;bottom:0;border-radius:99px}
.lbar i.up{background:linear-gradient(90deg,var(--acc),var(--acc2))}
.lbar i.down{background:var(--bad)}
.enter .cal .cd{animation:rise .5s var(--ease) both;animation-delay:calc(.15s + var(--c, 0) * 12ms)}

/* motion: content flows in when a screen opens */
.enter>*:not(.top){animation:rise .55s var(--ease) both;animation-delay:calc(var(--i, 0) * 55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.enter .bar>i{animation:growx 1s var(--ease) both;animation-delay:.25s}
@keyframes growx{from{width:0}}
.enter .bars .b i{animation:growy .9s var(--ease) both;animation-delay:calc(.2s + var(--j, 0) * 40ms)}
@keyframes growy{from{height:0}}
.enter .ring .arc{animation:ringin 1.2s var(--ease) both;animation-delay:.2s}
@keyframes ringin{from{stroke-dasharray:0 100}}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:70;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  for (var k in c) if (k !== 't' && k !== 'at') cfg[k] = c[k];
  if (!cfg.cats || !cfg.cats.length) cfg.cats = DEFAULT_CATS;

  cfg.habits = (cfg.habits || []).filter(function(h){ return h.id !== 'water'; });

  if (!S.rolled && S.synced){ S.rolled = true; rollSubs(); }

// recurring expenses (milk, maid, EMI…) share the subscription engine but are listed separately

function nextDate(s, date){
  if (s.per === 'day') return addDays(date, 1);
  if (s.per === 'week') return addDays(date, 7);
  var m = (PER[s.per] || PER.month).m, d = pd(date), anchor = s.anchor || d.getDate();
  var y = d.getFullYear(), mo = d.getMonth() + m, last = new Date(y, mo + 1, 0).getDate();
  return iso(new Date(y, mo, Math.min(anchor, last)));
}
// Renewals that have passed get logged as expenses (ids are fixed, so two phones can't double-log).
function rollSubs(){
  var t = today();
  subs().forEach(function(s){
    // recurring expenses (milk, maid…) are logged on the day itself; subscriptions the day after renewal
    var upTo = isRec(s) ? addDays(t, 1) : t;
    if (s.status !== 'active' || !s.autoLog || !s.next || s.next >= upTo) return;
    var next = s.next, guard = 0;
    while (next < upTo && guard++ < 400){
      var eid = 'exp_s_' + s.id + '_' + next;
      if (!S.recs[eid]) put(eid, {t:'exp', amt:s.amt, cat:s.cat || 'subs', note:s.name, date:next, pay:s.pay || 'Card', subId:s.id});
      next = nextDate(s, next);
    }
    var r = strip(s); r.next = next; r.trial = false; put(s.id, r);
  });
}
function subState(s){
  var n = diffDays(today(), s.next);
  if (s.status === 'paused') return {txt:'Paused', cls:''};
  if (s.status === 'cancelled') return {txt:'Cancelled', cls:''};
  if (n < 0) return {txt:'Due ' + inDays(s.next) + ' · mark paid', cls:'bad'};
  if (s.trial) return {txt:'Trial ends ' + inDays(s.next), cls:n <= 3 ? 'bad' : 'warn'};
  if (n === 0) return {txt:'Renews today', cls:'warn'};
  if (n <= (s.remind || 3)) return {txt:'Renews ' + inDays(s.next), cls:'warn'};
  return {txt:'Renews ' + dShort(s.next), cls:''};
}
function upcomingSubs(days){
  var lim = addDays(today(), days);
  return subs().filter(function(s){ return s.status === 'active' && s.next && s.next <= lim && (!isRec(s) || s.per !== 'day'); })
    .sort(function(a, b){ return a.next < b.next ? -1 : 1; });
}

// Walks forward from the start. Streak freeze (Duolingo-style): one missed day per Mon–Sun week is

function streakStats(k){

function countUp(el){
  var n = +el.dataset.n, f = el.dataset.f, t0 = performance.now(), dur = 900;
  if (!n) return;
  function step(t){
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = n * e;
    el.textContent = f === 'money' ? money(v, 0) : Math.round(v);

  }

}

// ---------- WORK DAY (check in / away time; moved here from the Diagnosis Room app) ----------
// A day is one wday_ record. Timers are timestamps (accumMs + runningSince), so they keep running on any
// device and nothing resets if you forget to stop one.
var AWAY = [
  {key:'break', label:'Break', icon:'☕', verb:'On break', color:'#9ca3af'},
  {key:'drive', label:'Drive', icon:'🚗', verb:'Driving', color:'#22c55e'},
  {key:'outing', label:'Outing', icon:'🚶', verb:'Out', color:'#f59e0b'},
  {key:'dogs', label:'Dogs', icon:'🐕', verb:'With the dogs', color:'#6d4aff'}

function awayOf(k){ return AWAY.filter(function(a){ return a.key === k; })[0]; }
function wdays(){ return list('wday').sort(function(a, b){ return (b.checkInAt || 0) - (a.checkInAt || 0); }); }
function openWd(){ return wdays().filter(function(w){ return !w.checkOutAt; })[0] || null; }
function chan(ch){ var a = (ch && ch.accumMs) || 0; if (ch && ch.runningSince) a += Date.now() - ch.runningSince; return a; }
function wdWork(w){ return chan(w.work); }
function wdAway(w, k){ return chan(w.away && w.away[k]); }
function wdAwayAll(w){ return sum(AWAY.map(function(a){ return wdAway(w, a.key); })); }
function wdActive(w){ if (!w || !w.away) return null; var f = AWAY.filter(function(a){ return w.away[a.key] && w.away[a.key].runningSince; })[0]; return f ? f.key : null; }
function workMsOn(d){ var I = idx(); return (I.work[d] || 0) + (I.openW && I.openW.date === d ? chan(I.openW.work) : 0); }
function hm(ms){ var m = Math.round(ms / 60000); return m >= 60 ? Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm' : m + 'm'; }
function hms(ms){ var s = Math.floor(ms / 1000); return Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60); }
function clockOf(ts){ return ts ? new Date(ts).toLocaleTimeString('en-IN', {hour:'numeric', minute:'2-digit'}) : ''; }
function wdDist(w){
  var segs = [{l:'Working', c:'var(--acc)', ms:wdWork(w)}].concat(AWAY.map(function(a){ return {l:a.label, c:a.color, ms:wdAway(w, a.key)}; })), tot = sum(segs, 'ms') || 1;

}

function carryTasks(){

// ---------- FOCUS TIMER (Pomodoro): 25/50/90 min blocks for work or a skill, then a short break ----------
function focusList(){ return list('focus'); }
function focusOn(d){ var f = focusList().filter(function(x){ return x.date === d; }); return {n:f.length, mins:sum(f, 'mins')}; }
function focusCard(){
  var F = S.focus, t = today(), fo = focusOn(t);
  if (F){
    var left = Math.max(0, F.start + F.dur * 60000 - Date.now()), pct = 100 - left / (F.dur * 60000) * 100, isBreak = F.phase === 'break';
    return '<div class="card hero focus"><div class="row" style="gap:16px">' + ring(pct, '<span class="ftick">' + Math.floor(left / 60000) + ':' + pad(Math.floor(left / 1000) % 60) + '</span>', isBreak ? 'break' : 'focus') +
      '<div class="grow"><div class="small muted">' + (isBreak ? '☕ Break' : '⏱ Focus · ' + esc(F.label)) + '</div><div class="mid">' + F.dur + ' min</div>' +
      '<div class="btns" style="margin-top:10px">' + (isBreak ? '<button class="btn sm" data-act="focus-stop">Skip break</button>' : '<button class="btn sm" data-act="focus-done">Finish now</button><button class="btn sm ghost" data-act="focus-stop">Cancel</button>') + '</div></div></div></div>';
  }
  var ss = skills(), last = lsGet('db-focus-last', {dur:25, target:'work'});
  return '<div class="card"><div class="h2">⏱ Focus timer<span class="tiny muted">' + (fo.n ? fo.n + ' today · ' + mins(fo.mins) : 'Pomodoro') + '</span></div>' +
    chips('fdur', [[25,'25 min'],[50,'50 min'],[90,'90 min']], last.dur) +
    '<div class="lbl">For</div>' + chips('ffor', [['work','💼 Work']].concat(ss.map(function(s){ return [s.id, (s.emoji || '🎯') + ' ' + esc(s.name)]; })), last.target, 'scroll') +
    '<button class="btn block" data-act="focus-start">▶ Start focus</button></div>';
}
function focusComplete(early){
  var F = S.focus; if (!F) return;
  if (F.phase === 'break'){ S.focus = null; lsDel('db-focus'); notify('☕ Break over', 'Ready for the next block?'); render(); return; }
  var m = early ? Math.max(1, Math.round((Date.now() - F.start) / 60000)) : F.dur, d = iso(new Date(F.start));
  put('focus_' + uid(), {t:'focus', date:d, mins:m, label:F.label, skillId:F.skillId || ''});
  if (F.skillId) put('prac_' + uid(), {t:'prac', skillId:F.skillId, date:d, mins:m, note:'Focus block', via:'focus'});
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
  notify('⏱ Focus done: ' + m + ' min', F.label + '. Take a 5-minute break.');
  S.focus = {start:Date.now(), dur:5, label:'Break', phase:'break'}; lsSet('db-focus', S.focus);
  toast('Focus block done ✓ ' + m + ' min. 5-minute break started.');
  render();
}

// ---------- READING STATS for a year ----------
function readStatsHtml(){
  var y = String(S.ryear), inY = function(d){ return String(d || '').slice(0, 4) === y; };
  var rs = reads().filter(function(r){ return inY(r.date); }), fin = books().filter(function(b){ return b.status === 'done' && inY(b.finished); });
  var minsY = sum(rs, 'mins'), pagesY = sum(rs.map(function(r){ return Math.max(0, (+r.to || 0) - (+r.from || 0)); }));
  if (!pagesY) pagesY = sum(fin, 'pages');
  var dayset = {}; rs.forEach(function(r){ dayset[r.date] = 1; });
  var spans = fin.filter(function(b){ return b.started && b.finished; }).map(function(b){ return Math.max(1, diffDays(b.started, b.finished) + 1); });
  var auth = {}; books().filter(function(b){ return b.author && (inY(b.finished) || inY(b.started) || b.status === 'reading'); }).forEach(function(b){ auth[b.author] = (auth[b.author] || 0) + 1; });
  var topA = Object.keys(auth).sort(function(a, b){ return auth[b] - auth[a]; }).slice(0, 3);
  var longest = fin.slice().sort(function(a, b){ return (b.pages || 0) - (a.pages || 0); })[0];
  var fastest = fin.filter(function(b){ return b.started && b.finished && b.pages; }).sort(function(a, b){ return (b.pages / (diffDays(b.started, b.finished) + 1)) - (a.pages / (diffDays(a.started, a.finished) + 1)); })[0];
  var concepts = 0; rs.forEach(function(r){ concepts += (r.concepts || []).length; });

  h += '<div class="stats"><div class="stat"><div class="k">Pages read</div><div class="v">' + pagesY.toLocaleString('en-IN') + '</div></div>' +
    '<div class="stat"><div class="k">Avg days per book</div><div class="v">' + (spans.length ? Math.round(sum(spans) / spans.length) : '–') + '</div></div>' +
    '<div class="stat"><div class="k">💡 Concepts</div><div class="v">' + concepts + '</div></div><div class="stat"><div class="k">❝ Quotes saved</div><div class="v">' + qs + '</div></div></div>';
  var mm = []; for (var i = 1; i <= 12; i++) mm.push(y + '-' + pad(i));
  var mv = mm.map(function(m){ return sum(rs.filter(function(r){ return ymOf(r.date) === m; }), 'mins'); }), mx = Math.max.apply(null, mv.concat([1]));

    return '<div class="b ' + (m === ymOf(today()) ? '' : 'dim') + '"><em>' + (mv[j] ? Math.round(mv[j] / 60) + 'h' : '') + '</em><i style="height:' + (mv[j] / mx * 100) + '%"></i><span>' + monShort(m).charAt(0) + '</span></div>';
  }).join('') + '</div></div>';
  if (longest || fastest || topA.length) h += '<div class="card"><div class="h2">Highlights</div>' +
    (longest ? '<div class="row between small" style="padding:6px 0"><span>📏 Longest book</span><b class="ell" style="max-width:60%">' + esc(longest.title) + ' · ' + longest.pages + ' p</b></div>' : '') +
    (fastest ? '<div class="row between small" style="padding:6px 0;border-top:1px solid var(--line)"><span>⚡ Fastest read</span><b class="ell" style="max-width:60%">' + esc(fastest.title) + ' · ' + Math.round(fastest.pages / (diffDays(fastest.started, fastest.finished) + 1)) + ' p/day</b></div>' : '') +

// While the app is open (or in the background) Daybook shows a notification at each reminder time.
// For reminders that fire even when the app is closed, "Add to phone calendar" saves them as daily alarms.
var REM_PRESETS = [
  {label:'Drink water', emoji:'💧', time:'11:00', kind:'water'}, {label:'Drink water', emoji:'💧', time:'15:00', kind:'water'},
  {label:'Check in for work', emoji:'💼', time:'09:30', kind:'checkin'}, {label:'Check out of work', emoji:'🚪', time:'19:30', kind:'checkout'},
  {label:'Log today\'s expenses', emoji:'💸', time:'21:00', kind:'expense'}, {label:'Read before bed', emoji:'📖', time:'22:00', kind:'read'},
  {label:'Write the day note', emoji:'📝', time:'22:30', kind:'note'}, {label:'Weekly review', emoji:'🗓️', time:'19:00', kind:'review'}
];
function reminders(){ return S.cfg.reminders || []; }
function remDue(r){
  // skip reminders that no longer apply today
  var t = today(), c = S.cfg;
  if (r.kind === 'water') return intake(t, 'water') < c.waterGoal;
  if (r.kind === 'checkin') return !openWd() && !workMsOn(t);
  if (r.kind === 'checkout') return !!openWd();
  if (r.kind === 'expense') return !spendOn(t);
  if (r.kind === 'read') return readMinsOn(t) < c.readMin;
  if (r.kind === 'note') return !(dayRec(t).note || '').trim();
  if (r.kind === 'review') return !!reviewWeekDue();
  return true;
}
function notify(title, body){
  try {
    if (window.Notification && Notification.permission === 'granted' && navigator.serviceWorker && navigator.serviceWorker.controller){
      navigator.serviceWorker.ready.then(function(reg){ reg.showNotification(title, {body:body || '', icon:'icons/icon-192.png', badge:'icons/favicon-32.png', tag:'daybook-' + title, vibrate:[100, 50, 100]}); });
      return;
    }
    if (window.Notification && Notification.permission === 'granted'){ new Notification(title, {body:body || '', icon:'icons/icon-192.png'}); return; }
  } catch (e) {}
  toast(title + (body ? ' · ' + body : ''));
}
function checkReminders(){
  if (!S.ready) return;
  var t = today(), now = new Date(), nowM = now.getHours() * 60 + now.getMinutes(), fired = lsGet('db-rem-fired', {});
  reminders().forEach(function(r){
    if (r.off) return;
    var p = String(r.time || '').split(':'), m = (+p[0]) * 60 + (+p[1]);
    if (nowM >= m && nowM - m <= 30 && fired[r.id] !== t){
      fired[r.id] = t; lsSet('db-rem-fired', fired);
      if (remDue(r)) notify((r.emoji ? r.emoji + ' ' : '') + r.label, 'Daybook reminder');
    }
  });
}
setInterval(checkReminders, 30000);

function remIcs(){
  var stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''), d0 = today().replace(/-/g, '');
  var ev = reminders().filter(function(r){ return !r.off; }).map(function(r){
    var tt = r.time.replace(':', '') + '00', label = String(r.label).replace(/[,;\\]/g, ' ');
    return ['BEGIN:VEVENT','UID:rem-' + r.id + '@daybook','DTSTAMP:' + stamp,'DTSTART:' + d0 + 'T' + tt,'DURATION:PT5M','RRULE:FREQ=DAILY','SUMMARY:' + (r.emoji || '') + ' ' + label,
      'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:' + label,'TRIGGER:PT0M','END:VALARM','END:VEVENT'].join('\r\n');
  });
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daybook//EN'].concat(ev).concat(['END:VCALENDAR']).join('\r\n');
}

// The lock is per phone (stored on this device only). Forgetting the PIN: sign out, sign back in.
function lockCfg(){ return lsGet('db-lock', null); }
function b64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function unb64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function sha(s){ return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(b64); }
function lockHtml(){

    '<div class="small" style="text-align:center;min-height:20px;color:var(--bad)">' + (wait ? 'Too many tries. Wait ' + Math.ceil(wait / 1000) + 's' : esc(S.lockMsg || '')) + '</div>' +

}

function bioCreate(){
  if (!window.PublicKeyCredential || !navigator.credentials) return Promise.reject(new Error('Fingerprint unlock isn\'t available here'));
  var ch = crypto.getRandomValues(new Uint8Array(32)), uidb = crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({publicKey:{challenge:ch, rp:{name:'Daybook', id:location.hostname}, user:{id:uidb, name:'daybook', displayName:'Daybook'},
    pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000}})
    .then(function(c){ return b64(c.rawId); });
}
function bioCheck(id){
  return navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), allowCredentials:[{type:'public-key', id:unb64(id)}], userVerification:'required', timeout:60000}});
}

// weekly snapshot of everything, kept on the phone (last 4)
function idb(){
  return new Promise(function(res, rej){
    var rq = indexedDB.open('daybook-snaps', 1);
    rq.onupgradeneeded = function(){ rq.result.createObjectStore('snaps', {keyPath:'at'}); };
    rq.onsuccess = function(){ res(rq.result); }; rq.onerror = function(){ rej(rq.error); };
  });
}
function snapList(){ return idb().then(function(db){ return new Promise(function(res){ var out = [], tx = db.transaction('snaps').objectStore('snaps').openCursor(); tx.onsuccess = function(e){ var c = e.target.result; if (c){ out.push(c.value); c.continue(); } else res(out.sort(function(a, b){ return b.at - a.at; })); }; }); }); }
function snapTake(force){
  if (!S.ready || !Object.keys(S.recs).length) return Promise.resolve();
  var last = lsGet('db-snap-at', 0);
  if (!force && Date.now() - last < 7 * 864e5) return Promise.resolve();
  return idb().then(function(db){
    return new Promise(function(res){
      var st = db.transaction('snaps', 'readwrite').objectStore('snaps');
      st.put({at:Date.now(), n:Object.keys(S.recs).length, recs:JSON.parse(JSON.stringify(S.recs))});
      st.transaction.oncomplete = function(){ lsSet('db-snap-at', Date.now()); res(); };
    });
  }).then(snapList).then(function(all){
    if (all.length > 4) return idb().then(function(db){ var st = db.transaction('snaps', 'readwrite').objectStore('snaps'); all.slice(4).forEach(function(s){ st.delete(s.at); }); });
  }).catch(function(e){ console.warn('snapshot', e); });
}

// ---------- READING SCHEDULE ----------
// A book can be planned from planStart to planEnd. Pages are spread evenly from the page you were on
// when you planned it (planFrom), so each day has a target page; reading sessions move b.page along.
function bookPlan(b){
  if (!b || !b.planStart || !b.planEnd || !(b.pages > 0) || b.status === 'done') return null;
  var t = today(), n = Math.max(1, diffDays(b.planStart, b.planEnd) + 1), from = Math.min(+b.planFrom || 0, b.pages), span = b.pages - from;
  function tgt(d){ var i = diffDays(b.planStart, d) + 1; return i <= 0 ? from : i >= n ? b.pages : Math.round(from + span * i / n); }
  var page = Math.min(+b.page || 0, b.pages), yTo = tgt(addDays(t, -1)), tTo = tgt(t), daysLeft = Math.max(1, diffDays(t, b.planEnd) + 1);
  var p = {start:b.planStart, end:b.planEnd, days:n, perDay:Math.max(1, Math.ceil(span / n)), page:page, todayTo:tTo,
    todayFrom:Math.max(page, yTo), need:Math.ceil(Math.max(0, b.pages - page) / daysLeft), expectPct:Math.min(100, tTo / b.pages * 100), behindBy:Math.max(0, yTo - page)};
  if (page >= b.pages) p.state = 'done';
  else if (t < b.planStart) p.state = 'upcoming';
  else if (t > b.planEnd) p.state = 'overdue';
  else if (page >= tTo) p.state = 'today-done';
  else if (page >= yTo) p.state = 'on-track';
  else p.state = 'behind';
  return p;
}
function planBadge(p){
  return {upcoming:'<span class="badge info">Starts ' + dShort(p.start) + '</span>', 'today-done':'<span class="badge good">Today done ✓</span>', 'on-track':'<span class="badge good">On track</span>',
    behind:'<span class="badge warn">' + p.behindBy + ' pages behind</span>', overdue:'<span class="badge bad">Past finish date</span>', done:'<span class="badge good">Finished 🎉</span>'}[p.state] || '';
}
// what to read today, e.g. "p.143–155"; catch-up pages are folded in
function planToday(b, p){
  if (p.state === 'upcoming' || p.state === 'done') return '';
  var to = p.state === 'overdue' ? b.pages : Math.max(p.todayTo, p.page + (p.state === 'today-done' ? 0 : 1));
  if (p.state === 'today-done') return 'Read up to p.' + p.todayTo + ' today ✓';
  return 'p.' + (p.page + 1) + '–' + to + ' · ' + (to - p.page) + ' pages' + (p.state === 'behind' ? ' (with catch-up)' : '');
}

    '<div class="row between tiny muted" style="margin-top:6px"><span>p.' + p.page + ' of ' + b.pages + '</span><span>' + (planToday(b, p) || (p.state === 'upcoming' ? 'Starts in ' + diffDays(today(), p.start) + ' days' : '')) + '</span></div></button>';

function ygValue(g){

function parseSms(t){
  var out = {};
  var m = t.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d{1,2})?)/i) || t.match(/([\d,]+(?:\.\d{1,2})?)\s*(?:rs|inr)\b/i);
  if (m) out.amt = parseFloat(m[1].replace(/,/g, ''));
  out.credit = /\b(credited|received|deposited|refund(ed)?)\b/i.test(t) && !/\b(debited|spent|sent|paid|withdrawn|purchase)\b/i.test(t);
  var mm = t.match(/\b(?:towards|to|at)\s+(?:vpa\s+|a\/c\s+)?(.+)/i);
  if (mm){
    var mer = mm[1].split(/\s+(?:on|ref|upi|avl|avbl|bal|via|from|using|dated|txn|for)\b|[,;]|\.\s|\.$|\s\d{1,2}[-\/]/i)[0];
    if (mer.indexOf('@') > -1) mer = mer.split('@')[0];
    mer = mer.replace(/[^A-Za-z0-9 &'.-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (mer && mer.length <= 40) out.note = mer.toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); });
  }
  var MON = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12}, y, mo, d, x;
  if ((x = t.match(/\b(20\d{2})-(\d{2})-(\d{2})/))){ y = +x[1]; mo = +x[2]; d = +x[3]; }
  else if ((x = t.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))){ d = +x[1]; mo = +x[2]; y = +x[3]; }
  else if ((x = t.match(/\b(\d{1,2})[- ]?([A-Za-z]{3})[a-z]*[- ,]?(\d{2,4})\b/)) && MON[x[2].toLowerCase()]){ d = +x[1]; mo = MON[x[2].toLowerCase()]; y = +x[3]; }
  if (y){
    if (y < 100) y += 2000;
    var ds = y + '-' + pad(mo) + '-' + pad(d), dt = pd(ds);
    if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31 && dt.getDate() === d && ds <= today() && diffDays(ds, today()) < 370) out.date = ds;
  }
  out.pay = /\bupi\b|vpa/i.test(t) ? 'UPI' : /card/i.test(t) ? 'Card' : /atm|cash/i.test(t) ? 'Cash' : 'Bank';
  out.cat = guessCat((out.note || '') + ' ' + t);
  return out;
}

function icsFor(s){
  var p = PER[s.per] || PER.month, rem = s.remind || 3;

  var d = s.next.replace(/-/g, ''), e = addDays(s.next, 1).replace(/-/g, '');

document.addEventListener('change', function(e){
  if (e.target.dataset && e.target.dataset.rem){

    var fired = lsGet('db-rem-fired', {}); delete fired[rid]; lsSet('db-rem-fired', fired);

  }
  if (e.target.id === 'wd-note'){
    var w = openWd(); if (!w || !w.entries || !w.entries.length) return;
    var r = strip(w); r.entries = w.entries.slice(); var last = Object.assign({}, r.entries[r.entries.length - 1]);
    if (!last.endAt){ last.note = e.target.value.trim(); r.entries[r.entries.length - 1] = last; put(w.id, r); toast('Note saved'); }
    return;
  }
  if (e.target.id !== 'restore-file' || !e.target.files[0]) return;
  var fr = new FileReader();
  fr.onload = function(){
    try {
      var d = JSON.parse(fr.result), recs = d && d.recs;
      if (!recs || d.app !== 'daybook') throw new Error('not a Daybook backup');
      var n = Object.keys(recs).length;
      if (!confirm('Restore ' + n + ' records from this backup? Records with the same id are overwritten; nothing else is deleted.')) return;

});
